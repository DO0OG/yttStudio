name: v0.2.3 영상 열기 조건 일회성 수정

on:
  push:
    branches:
      - release/v0.2.3-prep

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: startsWith(github.event.head_commit.message, 'chore: 영상 열기 명령 조건 일회성 수정 시작')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 명령 활성 조건 수정
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/YttStudio.App/MainWindowViewModel.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'OpenVideoCommand = new AsyncCommand(OpenVideoAsync, () => videoSource is not null);':
                  'OpenVideoCommand = new AsyncCommand(OpenVideoAsync, CanOpenVideo);',
              'OpenVideoUrlCommand = new AsyncCommand(OpenVideoUrlAsync, () => videoSource is not null);':
                  'OpenVideoUrlCommand = new AsyncCommand(OpenVideoUrlAsync, CanOpenVideo);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one anchor: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          helper = Path('src/YttStudio.App/MainWindowViewModel.VideoAvailability.cs')
          helper.write_text('''namespace YttStudio.App;\n\npublic sealed partial class MainWindowViewModel\n{\n    /// <summary>이미 준비된 영상 소스가 있거나 프로그램 내부 설치가 가능한지 확인한다.</summary>\n    private bool CanOpenVideo()\n        => videoSource is not null || MpvAutoInstaller.IsAutomaticInstallationSupported;\n}\n''', encoding='utf-8')

          mpv_path = Path('src/YttStudio.App/MpvAutoInstaller.cs')
          mpv = mpv_path.read_text(encoding='utf-8')
          old = "key.StartsWith('/', StringComparison.Ordinal)"
          new = 'key.StartsWith("/", StringComparison.Ordinal)'
          if mpv.count(old) != 1:
              raise SystemExit('expected exactly one StartsWith char anchor')
          mpv_path.write_text(mpv.replace(old, new), encoding='utf-8')

          Path('src/YttStudio.App/StringComparisonExtensions.cs').unlink()
          Path('.github/workflows/v023-command-fix-once.yml').unlink()
          PY

      - name: Release 빌드
        run: dotnet build YttStudio.sln --configuration Release

      - name: 전체 테스트
        run: dotnet test YttStudio.sln --configuration Release --no-build

      - name: 검증된 수정 커밋
        shell: bash
        run: |
          git config user.name "MAD_DOGGO"
          git config user.email "95358325+DO0OG@users.noreply.github.com"
          git add -A
          git commit -m "fix: 첫 영상 열기 전에 자동 설치 경로 활성화" -m "- libmpv가 아직 없더라도 내부 자동 설치 지원 플랫폼에서는 영상과 YouTube 주소 열기 명령을 활성화
          - 테스트 주입 경로에서도 명령 가용성 계약을 플랫폼 기능 기준으로 판단
          - 임시 문자열 비교 확장을 제거하고 명시적인 문자열 오버로드로 정리
          - Release 빌드와 전체 테스트를 통과한 상태만 커밋"
          git push origin HEAD:release/v0.2.3-prep

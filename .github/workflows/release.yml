name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리즈로 만들 태그 (예: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: macos-latest
            rid: osx-arm64
            archive: mac
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 태그에서 버전 추출
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: 게시
        shell: bash
        run: |
          dotnet publish src/YttStudio.App/YttStudio.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:Version=${{ steps.version.outputs.number }} -p:DebugType=none --output "publish/${{ matrix.rid }}"

      - name: 배포 라이선스 payload 준비
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="publish/${{ matrix.rid }}"
          mkdir -p "$publish_dir/licenses/fonts" "$publish_dir/licenses/YTSubConverter"
          cp LICENSE "$publish_dir/LICENSE"
          cp docs/THIRD-PARTY-NOTICES.md "$publish_dir/THIRD-PARTY-NOTICES.txt"
          cp src/YttStudio.Render/Assets/Fonts/LICENSE-Roboto.txt "$publish_dir/licenses/fonts/LICENSE-Roboto.txt"
          cp src/YttStudio.Render/Assets/Fonts/LICENSE-Liberation.txt "$publish_dir/licenses/fonts/LICENSE-Liberation.txt"
          if [[ -f external/YTSubConverter/LICENSE ]]; then
            cp external/YTSubConverter/LICENSE "$publish_dir/licenses/YTSubConverter/LICENSE.txt"
          elif [[ -f external/YTSubConverter/LICENSE.txt ]]; then
            cp external/YTSubConverter/LICENSE.txt "$publish_dir/licenses/YTSubConverter/LICENSE.txt"
          else
            echo "YTSubConverter license file is missing" >&2
            exit 1
          fi

          test -s "$publish_dir/LICENSE"
          test -s "$publish_dir/THIRD-PARTY-NOTICES.txt"
          test -s "$publish_dir/licenses/fonts/LICENSE-Roboto.txt"
          test -s "$publish_dir/licenses/fonts/LICENSE-Liberation.txt"
          test -s "$publish_dir/licenses/YTSubConverter/LICENSE.txt"

          # yt-dlp, Deno, libmpv/KMediaMpv 네이티브 런타임은 첫 사용 시 upstream에서
          # 검증 설치하므로 yttStudio 릴리스 산출물에 직접 포함되어서는 안 된다.
          if find "$publish_dir" -type f \( \
              -name 'yt-dlp' -o \
              -name 'yt-dlp.exe' -o \
              -name 'yt-dlp_macos' -o \
              -name 'yt-dlp_linux' -o \
              -name 'deno' -o \
              -name 'deno.exe' \
            \) -print -quit | grep -q .; then
            echo "yt-dlp/Deno must not be bundled in yttStudio release artifacts" >&2
            exit 1
          fi

          if find "$publish_dir" -type f \( \
              -name 'libmpv*.dll' -o \
              -name 'mpv-2.dll' -o \
              -name 'libmpv*.dylib' -o \
              -name 'libmpv*.so*' -o \
              -name 'libkmediampv_*' -o \
              -name 'kmedia.jar' -o \
              -name 'kmedia-mpv-*-runtime-desktop.jar' \
            \) -print -quit | grep -q .; then
            echo "libmpv/KMediaMpv runtime must not be bundled in yttStudio release artifacts" >&2
            exit 1
          fi

      - name: 압축 (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "artifacts/yttStudio-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.zip"

      - name: 설치 프로그램 (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) {
            choco install innosetup --no-progress --yes
          }
          if (-not (Test-Path "$inno\ISCC.exe")) {
            throw "ISCC.exe 를 찾지 못했다: $inno"
          }
          $defines = @(
            "/DAppVersion=${{ steps.version.outputs.number }}",
            "/DSourceDir=$PWD\publish\${{ matrix.rid }}",
            "/DOutputDir=$PWD\artifacts"
          )
          if (Test-Path "$inno\Languages\Korean.isl") { $defines += "/DHaveKorean" }
          & "$inno\ISCC.exe" $defines "packaging\windows\yttStudio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 컴파일 실패 ($LASTEXITCODE)" }

      - name: 앱 번들과 디스크 이미지 (macOS)
        if: matrix.archive == 'mac'
        shell: bash
        env:
          COPYFILE_DISABLE: "1"
        run: |
          bash packaging/macos/build-macos.sh "publish/${{ matrix.rid }}" "${{ steps.version.outputs.number }}" bundle artifacts
          tar -czf "artifacts/yttStudio-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.tar.gz" -C bundle .

      - name: 압축 (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/yttStudio-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" .

      - name: AppImage (Linux)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          bash packaging/linux/build-appimage.sh "publish/${{ matrix.rid }}" "${{ steps.version.outputs.number }}" artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: yttStudio-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 릴리즈 생성
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
            gh release upload "$tag" --repo "$repo" --clobber artifacts/*
            gh release edit "$tag" --repo "$repo" --notes-file .github/RELEASE_NOTES.md
          else
            gh release create "$tag" --repo "$repo" --title "yttStudio $tag" --notes-file .github/RELEASE_NOTES.md artifacts/*
          fi

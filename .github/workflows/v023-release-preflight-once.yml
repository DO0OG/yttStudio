name: KMediaMpv 실제 파일명 수정 검증

on:
  push:
    branches:
      - release/v0.2.3-prep

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: KMediaMpv 계약과 설치 파일명 수정
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/YttStudio.App/MpvAutoInstaller.cs')
          source = source_path.read_text(encoding='utf-8')
          anchor = '''    internal const long KMediaAssetLength = 25_946_200;\n'''
          addition = '''    internal const long KMediaAssetLength = 25_946_200;\n    internal const string KMediaMacArchivePrefix = "META-INF/kmediampv/native/macos-aarch64/";\n    internal const string KMediaLinuxArchivePrefix = "META-INF/kmediampv/native/linux-x86_64/";\n    internal const string KMediaMacLibraryFileName = "libkmediampv_mpv.dylib";\n    internal const string KMediaLinuxLibraryFileName = "libkmediampv_mpv.so";\n'''
          if source.count(anchor) != 1:
              raise SystemExit('KMedia constants anchor mismatch')
          source = source.replace(anchor, addition, 1)
          replacements = {
              '''                "META-INF/kmediampv/native/macos-aarch64/",\n                ["libmpv.2.dylib", "libmpv.dylib"]);''':
              '''                KMediaMacArchivePrefix,\n                [KMediaMacLibraryFileName]);''',
              '''                "META-INF/kmediampv/native/linux-x86_64/",\n                ["libmpv.so.2", "libmpv.so"]);''':
              '''                KMediaLinuxArchivePrefix,\n                [KMediaLinuxLibraryFileName]);''',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'source replacement anchor mismatch: {old}')
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/YttStudio.App.Tests/MpvAutoInstallerContractTests.cs')
          test = test_path.read_text(encoding='utf-8')
          start = test.index('    [Theory]\n    [InlineData(\n        MpvPackagePlatform.MacOS,')
          end = test.index('    [Theory]\n    [InlineData(MpvPackagePlatform.Windows)]', start)
          replacement = '''    [Fact]\n    public void KMediaPackageMatchesPinnedArchiveLayout()\n    {\n        Assert.Equal(\n            "META-INF/kmediampv/native/macos-aarch64/",\n            MpvAutoInstaller.KMediaMacArchivePrefix);\n        Assert.Equal(\n            "META-INF/kmediampv/native/linux-x86_64/",\n            MpvAutoInstaller.KMediaLinuxArchivePrefix);\n        Assert.Equal("libkmediampv_mpv.dylib", MpvAutoInstaller.KMediaMacLibraryFileName);\n        Assert.Equal("libkmediampv_mpv.so", MpvAutoInstaller.KMediaLinuxLibraryFileName);\n    }\n\n'''
          test = test[:start] + replacement + test[end:]
          test_path.write_text(test, encoding='utf-8')

          Path('.github/workflows/v023-release-preflight-once.yml').unlink()
          PY

      - name: 고정 KMediaMpv 자산 재검증
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output kmedia.jar \
            "https://github.com/Shusek/KMediaMpv/releases/download/v0.2.9/kmedia-mpv-0.2.9-runtime-desktop.jar"
          echo "4250b47144de085c7963f4bdbe99e995b9b2b0374e32a14ebe9d27fd38a67bef  kmedia.jar" | sha256sum --check --strict
          test "$(stat -c%s kmedia.jar)" = "25946200"
          unzip -Z1 kmedia.jar | grep -Fx 'META-INF/kmediampv/native/macos-aarch64/libkmediampv_mpv.dylib'
          unzip -Z1 kmedia.jar | grep -Fx 'META-INF/kmediampv/native/linux-x86_64/libkmediampv_mpv.so'

      - name: Release 빌드
        run: dotnet build YttStudio.sln --configuration Release

      - name: 전체 테스트
        run: dotnet test YttStudio.sln --configuration Release --no-build

      - name: 검증된 수정 커밋
        shell: bash
        run: |
          git config user.name "MAD_DOGGO"
          git config user.email "95358325+DO0OG@users.noreply.github.com"
          git add -A
          git commit -m "fix: KMediaMpv 실제 라이브러리 파일명으로 자동 설치 수정" -m "macOS arm64와 Linux x64의 KMediaMpv v0.2.9 런타임에서 실제 제공되는 libkmediampv_mpv.dylib과 libkmediampv_mpv.so를 설치 대상으로 사용한다. 플랫폼별 아카이브 prefix와 라이브러리 파일명을 계약 상수로 고정하고 회귀 테스트를 추가하며, 고정 JAR의 SHA-256과 실제 항목을 다시 확인한 뒤 Release 빌드와 전체 테스트를 통과한 상태만 커밋한다."
          git push origin HEAD:release/v0.2.3-prep

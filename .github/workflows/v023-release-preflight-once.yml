name: KMediaMpv v0.2.9 내부 경로 진단

on:
  push:
    branches:
      - release/v0.2.3-prep

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: KMediaMpv 자산 다운로드와 목록 확인
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output kmedia.jar \
            "https://github.com/Shusek/KMediaMpv/releases/download/v0.2.9/kmedia-mpv-0.2.9-runtime-desktop.jar"
          echo "4250b47144de085c7963f4bdbe99e995b9b2b0374e32a14ebe9d27fd38a67bef  kmedia.jar" | sha256sum --check --strict
          echo '=== libmpv entries ==='
          unzip -Z1 kmedia.jar | grep -i 'libmpv' || true
          echo '=== native entries ==='
          unzip -Z1 kmedia.jar | grep -E -i 'native|macos|linux' | head -300 || true
